# git-cliff configuration for firefly-jar.
#
# git-cliff generates only the grouped commit list under each release heading. The prose above it
# is hand-written: `task changelog TAG=vX.Y.Z` prepends a new section, and you write the summary
# into it before tagging.
#
# The section becomes the GitHub release body verbatim, via .github/scripts/extract-changelog.sh.
# Nothing regenerates it at release time.

[changelog]
# MUST stay byte-identical to the top of CHANGELOG.md (its title, the preamble and the rule that
# closes it). `--prepend` strips this string from the existing file and re-emits it above the new
# section; if it does not match, the strip silently does nothing and the new section lands above
# the title, which extract-changelog.sh would then swallow into the release body. Edit one, edit
# the other.
header = """
# Changelog

What changed in each `firefly-jar` release and why. Summaries are written by hand; the commit
lists under them are generated with [git-cliff](https://git-cliff.org) via
`task changelog TAG=vX.Y.Z`.

Versions follow [semver](https://semver.org). Commits follow
[Conventional Commits](https://www.conventionalcommits.org).

---

"""
body = """
{% if version %}\
## {{ version }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.raw_message | split(pat="\\n") | first | trim }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/Toshik1978/firefly-jar/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
---


"""
footer = ""
trim = true

[git]
conventional_commits = true
# Keep non-conventional commits: they land in "Others" rather than vanishing.
filter_unconventional = false
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
topo_order = false

# The first matching parser wins, so the skips come before the groups.
commit_parsers = [
  { message = '^Merge ', skip = true },
  # Bookkeeping (beads, toolchain) and test-only changes mean nothing to someone running the tool.
  { message = '^chore', skip = true },
  { message = '^test', skip = true },
  { message = '^style', skip = true },
  # Dependabot's prefixes (.github/dependabot.yml). Single-quoted TOML literal strings, so the
  # backslash reaches the regex engine as-is. Do not double it.
  { message = '^build\(deps', skip = true },
  { message = '^ci\(deps', skip = true },
  { message = '^feat', group = "<!-- 0 -->Features" },
  { message = '^fix', group = "<!-- 1 -->Bug Fixes" },
  { message = '.*', group = "<!-- 2 -->Others" },
]

[tools]
go = "1.27"
# golangci-lint floats on `latest` here and in CI's golangci-lint-action, so neither side is pinned
# behind the other. Locally, `latest` moves only when you run `mise upgrade`; run it when CI's lint
# disagrees with yours.
golangci-lint = "latest"
# Release tooling: `task changelog` runs git-cliff, `task release:*` run GoReleaser.
goreleaser = "2"
git-cliff = "2"

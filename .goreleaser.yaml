version: 2

project_name: firefly-jar

before:
  hooks:
    - go mod download

builds:
  - id: firefly-jar
    main: ./cmd/firefly-jar
    binary: firefly-jar
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # No -X: `firefly-jar --version` reads the module version the Go toolchain stamps from git, which
    # in a release checkout is the tag itself. The release workflow proves that before publishing.
    ldflags:
      - -s -w
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: firefly-jar
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Both licenses ride along with every binary: MIT asks for its notice in every copy, and
    # Apache-2.0 asks the same for internal/civil, which is compiled into the binary.
    files:
      - LICENSE
      - src: internal/civil/LICENSE
        dst: LICENSE.civil
      - README.md
      - config.example.yaml

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

# The changelog pipe stays enabled on purpose: `changelog: disable: true` also makes GoReleaser
# ignore `--release-notes` and publish an empty body. Enabled, it takes the section the release
# workflow extracted from CHANGELOG.md as the body and generates nothing of its own.
release:
  # Pinned rather than inferred from `origin`: a rename, a move or a fork's tag push would otherwise
  # publish to the wrong repository without a warning.
  github:
    owner: Toshik1978
    name: firefly-jar
  draft: false
  prerelease: auto

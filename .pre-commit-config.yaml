default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: golangci-lint-fmt
        name: golangci-lint fmt --diff
        entry: golangci-lint fmt --diff
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-commit]

      - id: task-check
        name: task check
        entry: task check
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Secrets in the staged diff, before they reach history: a pushed secret
      # has to be rotated, not just removed. False positives go in .gitleaks.toml.
      - id: gitleaks
        name: gitleaks (staged)
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Stock file guards: oversized files, leftover conflict markers, YAML that
  # does not parse. Not the whitespace fixers: they rewrite patches, fixtures
  # and generated files (piloted on linux-config, 2026-11-18).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        stages: [pre-commit]
